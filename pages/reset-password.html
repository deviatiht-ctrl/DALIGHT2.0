<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nouveau mot de passe — DALIGHT</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="../assets/images/logodaligth.png?v=2" type="image/png" />
    <link href="../vendor/fonts/google-fonts.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css?v=5.0.0" />
    <link rel="stylesheet" href="../css/responsive.css?v=5.0.0" />
    <script src="../vendor/supabase/supabase.min.js"></script>
  </head>
  <body data-page="reset-password">
    <header class="site-header internal">
      <nav class="top-nav">
        <a class="brand" href="../index.html">
          <img class="brand-logo" src="../assets/images/logodaligth.png?v=2" alt="DALIGHT" />
          <div>
            <strong>DALIGHT</strong>
            <small>L'Art du Bien-Être</small>
          </div>
        </a>
        <div class="nav-links">
          <a href="../index.html">Accueil</a>
          <a href="./services.html">Services</a>
          <a href="./login.html">Connexion</a>
        </div>
      </nav>
    </header>

    <main class="auth-shell fade-in">
      <section class="card form-card auth-form" style="max-width:480px;margin:0 auto;">
        <h2>Nouveau mot de passe</h2>
        <p class="page-subtitle">Chwazi yon nouvo modpas pou kont ou a.</p>

        <div id="reset-status" role="status"></div>

        <form id="reset-form" style="display:none;">
          <div class="input-group">
            <label for="new-password">Nouveau mot de passe</label>
            <input type="password" id="new-password" name="password" required minlength="6" placeholder="••••••••" />
          </div>
          <div class="input-group">
            <label for="confirm-password">Confirmer le mot de passe</label>
            <input type="password" id="confirm-password" name="confirm" required minlength="6" placeholder="••••••••" />
          </div>
          <button class="btn" type="submit" id="reset-submit">Mete ajou modpas la</button>
        </form>

        <p class="form-note" style="margin-top:1rem;">
          <a href="./login.html">← Retour à la connexion</a>
        </p>
      </section>
    </main>

    <footer class="site-footer">
      <p>© <span id="year">2026</span> DALIGHT. Tous droits réservés.</p>
      <div class="footer-links">
        <a href="./login.html">Espace client</a>
        <a href="./services.html">Nos Services</a>
        <a href="mailto:dalightbeauty15mai@gmail.com">dalightbeauty15mai@gmail.com</a>
      </div>
      <div class="footer-credit">
        <span>Conçu avec soin par <a href="https://cvisualagency.org" target="_blank" rel="noopener" class="cvisual-link">Cvisual</a></span>
      </div>
    </footer>

    <script>
      const SUPABASE_URL = 'https://rbwoiejztrkghfkpxquo.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJid29pZWp6dHJrZ2hma3B4cXVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyMDI1OTcsImV4cCI6MjA5MTc3ODU5N30.4NnApWYerIEcS8IBixBdsVHSgTUDO4OTTi6fSxdxu_U';
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const statusEl = document.getElementById('reset-status');
      const formEl = document.getElementById('reset-form');

      function setStatus(type, text) {
        statusEl.className = 'alert ' + type;
        statusEl.textContent = text;
      }

      // Supabase detekte token nan URL la (#access_token=...&type=recovery)
      let recoveryReady = false;

      sb.auth.onAuthStateChange((event) => {
        if (event === 'PASSWORD_RECOVERY') {
          recoveryReady = true;
          formEl.style.display = 'block';
          setStatus('success', 'Lyen an valide — antre nouvo modpas ou a.');
        }
      });

      // Si hash la gen recovery token men evènman an pase deja
      setTimeout(async () => {
        if (!recoveryReady) {
          const hash = window.location.hash;
          const hasRecovery = hash.includes('type=recovery') || hash.includes('access_token');
          const { data: { session } } = await sb.auth.getSession();
          if (session || hasRecovery) {
            formEl.style.display = 'block';
            setStatus('success', 'Antre nouvo modpas ou a.');
          } else {
            setStatus('error', 'Lyen an pa valide oswa li ekspire. Retounen nan paj connexion an epi mande yon nouvo lyen.');
          }
        }
      }, 1500);

      formEl.addEventListener('submit', async (e) => {
        e.preventDefault();
        const pw = document.getElementById('new-password').value;
        const pw2 = document.getElementById('confirm-password').value;
        if (pw.length < 6) { setStatus('error', 'Modpas la dwe gen omwen 6 karaktè.'); return; }
        if (pw !== pw2) { setStatus('error', 'Modpas yo pa menm.'); return; }

        const btn = document.getElementById('reset-submit');
        btn.disabled = true;
        setStatus('success', 'Mizajou an kou...');

        const { error } = await sb.auth.updateUser({ password: pw });
        if (error) {
          setStatus('error', 'Erè: ' + error.message);
          btn.disabled = false;
          return;
        }

        setStatus('success', '✓ Modpas la chanje! Redireksyon...');
        await sb.auth.signOut();
        setTimeout(() => { window.location.href = './login.html'; }, 2000);
      });

      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
