<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Employé - DALIGHT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #171a23;
      --surface-2: #1f232f;
      --border: #2a2f3d;
      --text: #eef1f7;
      --muted: #9aa3b2;
      --gold: #c9a227;
      --gold-soft: rgba(201,162,39,.14);
      --green: #22c55e;
      --blue: #3b82f6;
      --purple: #8b5cf6;
      --red: #ef4444;
      --radius: 16px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; }
    body::before { content:''; position:fixed; inset:0; z-index:-1;
      background:
        radial-gradient(ellipse at 12% -5%, rgba(201,162,39,.10) 0%, transparent 42%),
        radial-gradient(ellipse at 90% 105%, rgba(139,92,246,.08) 0%, transparent 45%),
        var(--bg); }
    .serif { font-family:'Playfair Display',serif; }
    .hidden { display:none !important; }

    /* ---------- LOGIN ---------- */
    .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
    .login-card { width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border);
      border-radius:24px; padding:2.5rem 2rem; box-shadow:0 24px 60px rgba(0,0,0,.4); text-align:center; }
    .login-logo { font-family:'Playfair Display',serif; font-size:2rem; font-weight:700; letter-spacing:1px; }
    .login-logo span { color:var(--gold); }
    .login-sub { color:var(--muted); font-size:.85rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:2rem; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; cursor:pointer;
      border:none; border-radius:12px; font-weight:600; font-size:.92rem; padding:.8rem 1.3rem; transition:all .18s; font-family:inherit; }
    .btn-gold { background:linear-gradient(135deg,#d9b53a,#b8941f); color:#1a1400; width:100%; margin-top:1.2rem; font-size:1rem; }
    .btn-gold:hover { filter:brightness(1.07); transform:translateY(-1px); }
    .btn-ghost { background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
    .btn-ghost:hover { border-color:var(--gold); }
    .login-error { color:var(--red); font-size:.85rem; margin-top:1rem; min-height:1.2rem; }

    /* ---------- SHELL ---------- */
    .shell { display:grid; grid-template-columns:250px 1fr; min-height:100vh; }
    .sidebar { background:var(--surface); border-right:1px solid var(--border); padding:1.5rem 1rem; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
    .side-logo { font-family:'Playfair Display',serif; font-size:1.4rem; font-weight:700; padding:0 .5rem 1.2rem; border-bottom:1px solid var(--border); margin-bottom:1rem; }
    .side-logo span { color:var(--gold); }
    .side-profile { display:flex; align-items:center; gap:.7rem; padding:.6rem .5rem 1rem; }
    .avatar { width:44px; height:44px; border-radius:50%; background:var(--gold-soft); color:var(--gold); display:flex; align-items:center; justify-content:center; font-weight:700; overflow:hidden; flex-shrink:0; }
    .avatar img { width:100%; height:100%; object-fit:cover; }
    .side-profile-name { font-weight:600; font-size:.9rem; }
    .side-profile-role { font-size:.72rem; color:var(--muted); }
    .nav { display:flex; flex-direction:column; gap:.15rem; flex:1; overflow-y:auto; }
    .nav-item { display:flex; align-items:center; gap:.7rem; padding:.7rem .8rem; border-radius:10px; color:var(--muted);
      cursor:pointer; font-size:.9rem; font-weight:500; transition:all .15s; border:none; background:none; text-align:left; width:100%; font-family:inherit; }
    .nav-item:hover { background:var(--surface-2); color:var(--text); }
    .nav-item.active { background:var(--gold-soft); color:var(--gold); font-weight:600; }
    .nav-item svg { width:18px; height:18px; flex-shrink:0; }
    .logout { margin-top:auto; }

    .main { padding:1.8rem 2rem 3rem; overflow-x:hidden; }
    .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.6rem; gap:1rem; flex-wrap:wrap; }
    .page-title { font-size:1.5rem; font-weight:700; }
    .page-sub { color:var(--muted); font-size:.85rem; margin-top:.15rem; }
    .mobile-menu { display:none; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:.5rem; cursor:pointer; color:var(--text); }
    .bell { position:relative; cursor:pointer; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:.5rem; color:var(--text); }
    .bell:hover { border-color:var(--gold); color:var(--gold); }
    .bell-badge { position:absolute; top:-3px; right:-3px; background:var(--red); color:#fff; font-size:.65rem; font-weight:700; min-width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
    .bell-panel { position:absolute; right:0; top:48px; width:320px; max-width:90vw; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:.8rem; z-index:50; box-shadow:0 16px 40px rgba(0,0,0,.4); display:none; }
    .bell-panel.open { display:block; }
    .notif-item { padding:.7rem; border-bottom:1px solid var(--border); font-size:.85rem; cursor:pointer; }
    .notif-item:last-child { border-bottom:none; }
    .notif-item.unread { background:rgba(59,130,246,.08); border-radius:10px; margin-bottom:.4rem; }
    .notif-title { font-weight:600; }
    .notif-body { color:var(--muted); font-size:.8rem; margin-top:.15rem; }
    .notif-time { font-size:.7rem; color:var(--muted); margin-top:.2rem; }

    /* ---------- CARDS / GRID ---------- */
    .grid { display:grid; gap:1.1rem; }
    .cards-4 { grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }
    .cards-2 { grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1.3rem; }
    .stat-card { position:relative; overflow:hidden; }
    .stat-icon { width:40px; height:40px; border-radius:11px; display:flex; align-items:center; justify-content:center; margin-bottom:.8rem; }
    .stat-value { font-size:1.9rem; font-weight:800; line-height:1; }
    .stat-label { color:var(--muted); font-size:.8rem; margin-top:.35rem; }
    .card-title { font-size:1.05rem; font-weight:700; margin-bottom:1rem; display:flex; align-items:center; justify-content:space-between; gap:.5rem; }

    /* ---------- CHRONO ---------- */
    .chrono-box { text-align:center; padding:1.5rem; background:var(--surface-2); border-radius:14px; }
    .chrono-time { font-size:3.2rem; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:2px; }
    .chrono-service { color:var(--gold); font-weight:600; margin-top:.3rem; }
    .chrono-client { color:var(--muted); font-size:.9rem; }
    .row-actions { display:flex; gap:.6rem; justify-content:center; margin-top:1.2rem; flex-wrap:wrap; }
    .btn-green { background:var(--green); color:#04210f; }
    .btn-red { background:var(--red); color:#2a0606; }
    .btn-blue { background:var(--blue); color:#031024; }
    .btn-sm { padding:.5rem .9rem; font-size:.82rem; }

    /* ---------- LISTS / TABLE ---------- */
    .list-item { display:flex; align-items:center; gap:.9rem; padding:.85rem; border:1px solid var(--border); border-radius:12px; margin-bottom:.6rem; background:var(--surface-2); }
    .list-item:last-child { margin-bottom:0; }
    .badge { display:inline-block; padding:.2rem .55rem; border-radius:7px; font-size:.7rem; font-weight:700; }
    .badge-green { background:rgba(34,197,94,.16); color:#4ade80; }
    .badge-blue { background:rgba(59,130,246,.16); color:#60a5fa; }
    .badge-gold { background:var(--gold-soft); color:var(--gold); }
    .badge-purple { background:rgba(139,92,246,.16); color:#a78bfa; }
    .badge-muted { background:var(--surface); color:var(--muted); }
    .table { width:100%; border-collapse:collapse; }
    .table th { text-align:left; font-size:.72rem; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); padding:.6rem .7rem; border-bottom:1px solid var(--border); }
    .table td { padding:.7rem; border-bottom:1px solid var(--border); font-size:.88rem; }
    .table tr:last-child td { border-bottom:none; }

    .form-group { margin-bottom:1rem; }
    .form-group label { display:block; font-size:.8rem; font-weight:600; color:var(--muted); margin-bottom:.4rem; }
    .input, .textarea, .select { width:100%; padding:.7rem .85rem; background:var(--surface-2); border:1px solid var(--border);
      border-radius:10px; color:var(--text); font-family:inherit; font-size:.9rem; outline:none; transition:border-color .15s; }
    .input:focus, .textarea:focus, .select:focus { border-color:var(--gold); }
    .textarea { resize:vertical; min-height:90px; }
    .empty { text-align:center; color:var(--muted); padding:2.5rem 1rem; font-size:.9rem; }
    .chart-wrap { position:relative; height:260px; }
    .rating-stars { color:var(--gold); font-size:1.1rem; letter-spacing:2px; }
    .toast-box { position:fixed; bottom:1.5rem; right:1.5rem; z-index:9999; display:flex; flex-direction:column; gap:.5rem; }
    .toast { padding:.9rem 1.2rem; border-radius:12px; font-weight:600; font-size:.88rem; border:1px solid; animation:slideIn .25s ease; }
    .toast.success { background:rgba(34,197,94,.14); border-color:rgba(34,197,94,.3); color:#4ade80; }
    .toast.error { background:rgba(239,68,68,.14); border-color:rgba(239,68,68,.3); color:#f87171; }
    .toast.warning { background:rgba(201,162,39,.14); border-color:rgba(201,162,39,.3); color:var(--gold); }
    @keyframes slideIn { from { transform:translateX(110%); opacity:0; } to { transform:translateX(0); opacity:1; } }

    @media (max-width:860px) {
      .shell { grid-template-columns:1fr; }
      .sidebar { position:fixed; left:0; top:0; z-index:100; transform:translateX(-100%); transition:transform .25s; width:250px; }
      .sidebar.open { transform:translateX(0); }
      .mobile-menu { display:block; }
      .main { padding:1.2rem; }
    }
  </style>

<body>
  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <div class="glass-card" style="width:100%; max-width:420px; text-align:center; padding:2.5rem 2rem;">
      <div class="login-logo">DA<span>LIGHT</span></div>
      <div style="color:var(--admin-text-muted); font-size:.85rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:2rem;">Espace Employé</div>
      <input type="text" id="username-input" class="form-input" style="margin-bottom:.8rem; text-align:center;" placeholder="Nom d'utilisateur" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('password-input').focus()">
      <input type="password" id="password-input" class="form-input" style="text-align:center;" placeholder="Mot de passe" autocomplete="current-password" onkeydown="if(event.key==='Enter')staffLogin()">
      <button class="btn btn-primary" style="width:100%; margin-top:1.2rem;" onclick="staffLogin()">Se connecter</button>
      <div id="login-error" style="color:var(--admin-danger); font-size:.85rem; margin-top:1rem; min-height:1.2rem;"></div>
    </div>
  </div>

  <!-- PORTAL SHELL -->
  <div id="portal-shell" class="hidden">
    <aside class="admin-sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="#" class="sidebar-logo" onclick="return false;">
          <img src="assets/images/logodaligth.png?v=2" alt="DALIGHT" onerror="this.style.display='none'">
          <div class="sidebar-logo-text">DALIGHT<span>Portail Employé</span></div>
        </a>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Menu</div>
          <div id="nav-menu"></div>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-user-avatar" id="side-avatar"></div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="side-name">—</div>
            <div class="sidebar-user-role" id="side-role">—</div>
          </div>
        </div>
        <button class="btn btn-secondary" style="width:100%; margin-top:1rem;" onclick="staffLogout()">Déconnexion</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <div class="header-left">
          <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="24" height="24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div>
            <h1 class="page-title" id="section-title">Accueil</h1>
            <div class="admin-header-subtitle" id="section-sub"></div>
          </div>
        </div>
        <div class="header-right">
          <div style="position:relative;" id="bell-wrap">
            <button class="header-btn" id="bell-btn" onclick="toggleBellPanel()" aria-label="Notifications">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
              <span class="notification-dot hidden" id="bell-count">0</span>
            </button>
